name: Deploy arcade component

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    permissions:
      contents: write
    uses: quiet-build/.github/.github/workflows/deploy-arcade-component.yml@8f75852775e54f88430743f90ef83ad1a936b14f
    with:
      support-sha: 8f75852775e54f88430743f90ef83ad1a936b14f
      game-id: grove-rally
      prebuild-command: "pnpm test && node --test tests/redirect.test.mjs"
      postbuild-command: "pnpm exec playwright install --with-deps webkit && pnpm exec playwright test --config playwright.component.config.ts && pnpm test:e2e"
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
